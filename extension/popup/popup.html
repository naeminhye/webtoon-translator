<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webtoon Translator</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <span class="logo"><span class="logo-icon">📖</span> Webtoon Translator</span>
    <div class="header-right">
      <label class="switch" title="Enable / disable extension">
        <input type="checkbox" id="enabled-toggle" checked />
        <span class="slider"></span>
      </label>
      <button id="btn-settings" class="settings-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <section id="disabled-notice" class="notice hidden">
    Extension is turned off. Flip the switch to re-enable translation overlays.
  </section>

  <div id="main-ui">
    <section id="chapter-info" class="hidden">
      <div class="info-head">
        <span id="title-id" class="chapter-title">—</span>
        <span id="site-badge" class="badge"></span>
      </div>
      <p class="info-line"><span class="label">Chapter</span><span id="chapter-id">—</span></p>
      <p class="info-line">
        <span class="label">Progress</span>
        <span id="progress-text">—</span>
      </p>
      <div class="progress-bar-wrap">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </section>

    <section id="no-chapter" class="notice">
      Open a supported webtoon chapter to get started.
    </section>

    <div class="actions hidden" id="action-buttons">
      <!-- __DEV_TOOLS_BLOCK_START__ -->
      <button id="btn-panel" class="action-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Translation list
      </button>
      <!-- __DEV_TOOLS_BLOCK_END__ -->
      <button id="btn-clear" class="action-btn action-btn-danger">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Clear chapter translations
      </button>
    </div>
  </div>

  <footer>v0.3.0</footer>
  <script src="popup.js"></script>
</body>
</html>
