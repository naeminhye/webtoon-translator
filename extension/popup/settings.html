<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webtoon Translate — Settings</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="settings.css" />
</head>
<body class="settings-body">
  <header>
    <button id="btn-back" class="back-btn" title="Back">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span class="logo">Settings</span>
  </header>

  <section id="ocr-settings" class="settings-section">
    <div class="settings-head">OCR Engine</div>
    <div class="provider-row">
      <label class="provider-opt">
        <input type="radio" name="ocr-provider" value="tesseract" />
        <span>Tesseract.js</span>
        <span class="provider-hint">offline</span>
      </label>
      <label class="provider-opt">
        <input type="radio" name="ocr-provider" value="ocrspace" />
        <span>OCR.space</span>
        <span class="provider-hint">online · faster</span>
      </label>
    </div>
    <div id="ocrspace-key-row" class="hidden">
      <input type="password" id="ocrspace-key" placeholder="Paste your OCR.space API key" autocomplete="off" />
      <button id="save-ocrspace-key" class="key-save-btn">Save</button>
    </div>
    <p id="ocrspace-key-saved" class="key-saved hidden">API key saved ✓</p>
  </section>

  <section id="sync-settings" class="settings-section">
    <div class="settings-head">
      Cloud Sync
      <span id="sync-status-dot" class="sync-dot sync-dot-off" title="Not configured"></span>
    </div>

    <div id="sb-config-wrap">
      <input type="text"     id="sb-url"      placeholder="https://xxxx.supabase.co" autocomplete="off" />
      <input type="text"     id="sb-anon-key" placeholder="Anon / public key"        autocomplete="off" />
      <button id="sb-save-config" class="key-save-btn">Connect</button>
    </div>

    <div id="sb-auth-wrap" class="hidden">
      <div id="sb-login-form">
        <input type="email"    id="sb-email"    placeholder="Email"    autocomplete="email" />
        <input type="password" id="sb-password" placeholder="Password" autocomplete="current-password" />
        <button id="sb-signin-btn" class="key-save-btn" style="margin-top:2px">Sign in</button>
        <p id="sb-auth-error" class="sb-error hidden"></p>
      </div>
      <div id="sb-user-row" class="hidden">
        <span id="sb-user-email" class="sb-user-email"></span>
        <button id="sb-signout-btn" class="sb-link-btn">Sign out</button>
      </div>
    </div>
  </section>

  <footer>v0.2.0 · <span id="footer-sync-label">local only</span></footer>
  <script src="settings.js"></script>
</body>
</html>
